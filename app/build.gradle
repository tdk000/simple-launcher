plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.simplelauncher'
    compileSdk 35             // Android 15

    defaultConfig {
        applicationId "ru.simplelauncher"
        minSdk 21
        targetSdk 35          // modern-флейвор; legacy (target 23) собирает build.sh legacy
        // ЕДИНСТВЕННЫЙ ИСТОЧНИК ВЕРСИИ: отсюда читает и build.sh, и F-Droid.
        // legacy-APK получает versionCode на единицу меньше (см. build.sh).
        versionCode 14
        versionName "1.10"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

// Зависимостей НЕТ: только android.jar. Никаких androidx/material —
// благодаря этому APK весит ~35 КБ и ставится на Android 5.0+.
dependencies {
}
