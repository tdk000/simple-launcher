plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.simplelauncher'
    compileSdk 37             // Android 17

    defaultConfig {
        applicationId "ru.simplelauncher"
        minSdk 21
        targetSdk 37          // modern-флейвор; legacy (target 23) собирает build.sh legacy
        versionCode 8
        versionName "1.7"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

// Зависимостей НЕТ: только android.jar. Никаких androidx/material —
// благодаря этому APK весит 34 КБ и ставится на Android 5.0+.
dependencies {
}
